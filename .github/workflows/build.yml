name: Build FBNeo Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FBNeo source
        run: |
          git clone --depth 1 https://github.com/finalburnneo/FBNeo.git third_party/FBNeo
          echo "FBNeo commit: $(git -C third_party/FBNeo rev-parse HEAD)"

      - name: Apply Android patches
        run: |
          python3 - <<'PYEOF'
          import sys, pathlib
          FB = pathlib.Path("third_party/FBNeo")

          def patch_file(rel, subs):
              p = FB / rel
              s = p.read_text()
              for old, new in subs:
                  if new in s:
                      print("[skip] " + rel + ": already applied")
                      continue
                  n = s.count(old)
                  if n != 1:
                      print("[FAIL] " + rel + ": anchor found " + str(n) + "x: " + repr(old[:70]))
                      sys.exit(1)
                  s = s.replace(old, new)
                  print("[ok] " + rel)
              p.write_text(s)

          patch_file("src/burner/burner.h", [
              ('#elif defined(BUILD_QT)\n #include "burner_qt.h"\n#endif',
               '#elif defined(BUILD_QT)\n #include "burner_qt.h"\n#elif defined (BUILD_ANDROID)\n #include "burner_android.h"\n#endif'),
          ])

          patch_file("src/intf/video/vid_interface.cpp", [
              ('    extern struct VidOut VidOutOGL;\n#endif',
               '    extern struct VidOut VidOutOGL;\n#elif defined (BUILD_ANDROID)\nextern struct VidOut VidOutAndroid;\n#endif'),
              ('    &VidOutOGL,\n#endif',
               '    &VidOutOGL,\n#elif defined (BUILD_ANDROID)\n\t&VidOutAndroid,\n#endif'),
          ])

          patch_file("src/intf/audio/aud_interface.cpp", [
              ('    extern struct AudOut AudOutQtSound;\n#endif',
               '    extern struct AudOut AudOutQtSound;\n#elif defined (BUILD_ANDROID)\nextern struct AudOut AudOutAndroid;\n#endif'),
              ('    &AudOutQtSound,\n#endif',
               '    &AudOutQtSound,\n#elif defined (BUILD_ANDROID)\n\t&AudOutAndroid,\n#endif'),
          ])

          patch_file("src/intf/input/inp_interface.cpp", [
              ('\textern struct InputInOut InputInOutQt;\n#endif',
               '\textern struct InputInOut InputInOutQt;\n#elif defined (BUILD_ANDROID)\nextern struct InputInOut InputInOutAndroid;\n#endif'),
              ('\t&InputInOutQt,\n#endif',
               '\t&InputInOutQt,\n#elif defined (BUILD_ANDROID)\n\t&InputInOutAndroid,\n#endif'),
          ])

          print("All Android patches applied.")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK/NDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Build APK
        env:
          FBNEO_DIR: ${{ github.workspace }}/third_party/FBNeo
        run: |
          ./gradle-8.9/bin/gradle :app:assembleDebug \
            -PfbneoDir="$FBNEO_DIR" \
            -Dorg.gradle.daemon=false \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
